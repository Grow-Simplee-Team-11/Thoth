syntax="proto3";

package clustering;


option go_package = "github.com/Grow-Simplee-KGP/Thoth/proto/clustering";    

service Clustering{
    rpc GetClusters(ClusteringRequest) returns (ClusteringResponse) {}
}

message Box{
    int32 id=1;
    float length=2;
    float breadth=3;
    float height=4;
    float weight=5;
}

message Location{
    float latitude=1;
    float longitude=2;
}

message Package{
    int32 id=1;
    Box box=2;
    Location location=3;
}

message Cluster{
    repeated Package packages=1;
}

message ClusteringRequest{
    Box bin=1;
    repeated Box items=2;
}

message ClusteringResponse{
    repeated Cluster clusters=1;
}
