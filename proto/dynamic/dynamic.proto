//              coordinates
//          }
//}

syntax="proto3";

package dynamic;

option go_package = "github.com/Grow-Simplee-KGP/Thoth/proto/dynamic";    

message Location {
    int32 x = 1;
    int32 y = 2;
}

message Object {
    int32 id = 1;
    int32 length = 2;
    int32 breadth = 3;
    int32 height = 4;
    bool is_delivery = 5;
    Location location = 6;
}

message ObjectPaths{
    int32 vehicle=1;
    repeated Object objects=2;
    int32 volume = 3;
    int32 weight = 4;
    Location start = 5;
}

message DynamicRequest{
    Object pickup = 1;
    repeated int32 object_ids = 2;
    repeated ObjectPaths paths=3;
    Location hub = 4;
}

message DynamicResponse{
    int32 vehicle = 1;
    repeated int32 object_ids=2;
}

service DynamicRouting{
    rpc RunDynamic(DynamicRequest) returns (DynamicResponse){}
}